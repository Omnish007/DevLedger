name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Format, Lint, Typecheck & Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check code formatting
              run: npm run format:check

            - name: Run ESLint
              run: npm run lint

            - name: Run TypeScript typechecks
              run: npm run typecheck && npm run typecheck:e2e

            - name: Run static checks and Node test suites
              run: npm run check:all

    e2e:
        name: Build & Electron E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Electron system dependencies
              run: npx playwright install-deps chromium

            - name: Configure Electron chrome-sandbox
              run: |
                  sudo chown root:root node_modules/electron/dist/chrome-sandbox
                  sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

            - name: Build application and run Playwright E2E suite
              run: npm run test:e2e

            - name: Upload Playwright failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-e2e-artifacts
                  path: |
                      playwright-report/
                      test-results/e2e/
                  retention-days: 7
